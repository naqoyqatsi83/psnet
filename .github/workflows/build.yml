name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcap0.8-dev
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Build
        run: cargo build --release --verbose

      - name: Package .deb
        run: |
          VERSION="$(cargo metadata --format-version=1 --no-deps 2>/dev/null | jq -r '.packages[0].version' 2>/dev/null || echo "0.0.0")"
          PKG_ROOT="${{ runner.temp }}/deb/psnet_${VERSION}_amd64"
          mkdir -p "$PKG_ROOT/DEBIAN"
          mkdir -p "$PKG_ROOT/usr/bin"
          install -m 0755 target/release/psnet "$PKG_ROOT/usr/bin/psnet"
          {
            printf 'Package: psnet\n'
            printf 'Version: %s\n' "$VERSION"
            printf 'Section: net\n'
            printf 'Priority: optional\n'
            printf 'Architecture: amd64\n'
            printf 'Depends: libpcap0.8 (>= 1.9), libc6 (>= 2.31)\n'
            printf 'Maintainer: naqoyqatsi83 <naqoyqatsi83@users.noreply.github.com>\n'
            printf 'Description: Real-time TUI network monitor for Linux\n'
            printf ' 9 interactive tabs covering live speed graphs, active connections,\n'
            printf ' world map, LAN device discovery, firewall management, topology\n'
            printf ' visualization, and packet capture. All in a single binary.\n'
            printf 'Homepage: https://github.com/naqoyqatsi83/psnet\n'
          } > "$PKG_ROOT/DEBIAN/control"
          dpkg-deb --build "$PKG_ROOT" "${{ runner.temp }}/deb/psnet_${VERSION}_amd64.deb"

      - name: Upload binary
        uses: actions/upload-artifact@v5
        with:
          name: psnet-amd64
          path: target/release/psnet

      - name: Upload .deb
        uses: actions/upload-artifact@v5
        with:
          name: psnet-amd64.deb
          path: ${{ runner.temp }}/deb/psnet_*.deb
