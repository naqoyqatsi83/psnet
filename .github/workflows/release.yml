name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcap0.8-dev dpkg-dev
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Build release
        run: cargo build --release --verbose

      - name: Create .deb package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BINARY="${{ github.workspace }}/target/release/psnet"
          PKG_ROOT="${{ runner.temp }}/deb/psnet_${VERSION}_amd64"

          mkdir -p "$PKG_ROOT/DEBIAN"
          mkdir -p "$PKG_ROOT/usr/bin"
          mkdir -p "$PKG_ROOT/usr/share/doc/psnet"
          mkdir -p "$PKG_ROOT/usr/share/man/man1"

          install -m 0755 "$BINARY" "$PKG_ROOT/usr/bin/psnet"
          cp LICENSE "$PKG_ROOT/usr/share/doc/psnet/" 2>/dev/null || true
          cp README.md "$PKG_ROOT/usr/share/doc/psnet/"

          cat > "$PKG_ROOT/DEBIAN/control" <<CONTROL
Package: psnet
Version: ${VERSION}
Section: net
Priority: optional
Architecture: amd64
Depends: libpcap0.8 (>= 1.9), libc6 (>= 2.31)
Maintainer: naqoyqatsi83 <naqoyqatsi83@users.noreply.github.com>
Description: Real-time TUI network monitor for Linux
 9 interactive tabs covering live speed graphs, active connections,
 world map, LAN device discovery, firewall management, topology
 visualization, and packet capture. All in a single binary.
Homepage: https://github.com/naqoyqatsi83/psnet
CONTROL

          cat > "$PKG_ROOT/DEBIAN/postinst" <<'POSTINST'
#!/bin/sh
set -e
if [ -x /usr/bin/psnet ]; then
    /usr/sbin/setcap cap_net_raw+ep /usr/bin/psnet 2>/dev/null || true
fi
exit 0
POSTINST
          chmod 755 "$PKG_ROOT/DEBIAN/postinst"

          cat > "$PKG_ROOT/DEBIAN/postrm" <<'POSTRM'
#!/bin/sh
set -e
exit 0
POSTRM
          chmod 755 "$PKG_ROOT/DEBIAN/postrm"

          dpkg-deb --build "$PKG_ROOT" "${{ runner.temp }}/deb/psnet_${VERSION}_amd64.deb"

      - name: Create tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAR_DIR="${{ runner.temp }}/tar"
          mkdir -p "$TAR_DIR/psnet-${VERSION}"
          install -m 0755 "${{ github.workspace }}/target/release/psnet" "$TAR_DIR/psnet-${VERSION}/psnet"
          cp README.md LICENSE "$TAR_DIR/psnet-${VERSION}/" 2>/dev/null || true
          cd "$TAR_DIR" && tar czf "${{ runner.temp }}/psnet-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" "psnet-${VERSION}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: psnet ${{ github.ref_name }}
          body: |
            ## psnet ${{ github.ref_name }}

            ### Installation
            - **Debian/Ubuntu**: Download the `.deb` and run `sudo dpkg -i psnet_*.deb`
            - **Other distros**: Download the `.tar.gz`, extract, and run `./psnet` (optionally set `sudo setcap cap_net_raw+ep psnet`)

            ### Build from source
            ```bash
            cargo install --git https://github.com/naqoyqatsi83/psnet.git
            ```
          files: |
            ${{ runner.temp }}/deb/psnet_*.deb
            ${{ runner.temp }}/psnet-*.tar.gz
