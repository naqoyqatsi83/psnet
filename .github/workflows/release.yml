name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - target: x86_64-unknown-linux-gnu
            rust_target: x86_64-unknown-linux-gnu
            deb_arch: amd64
            cross_prefix: ""
            pkg_suffix: x86_64
            syslib: libpcap0.8
          - target: aarch64-unknown-linux-gnu
            rust_target: aarch64-unknown-linux-gnu
            deb_arch: arm64
            cross_prefix: aarch64-linux-gnu-
            pkg_suffix: aarch64
            syslib: libpcap0.8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcap0.8-dev

      - name: Set up QEMU for ARM64
        if: matrix.arch.cross_prefix != ''
        uses: docker/setup-qemu-action@v3

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-${{ matrix.arch.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Determine version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION_STRIPPED=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          else
            V=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[0].version')
            echo "VERSION_STRIPPED=$V" >> $GITHUB_ENV
          fi

      - name: Build release (${{ matrix.arch.target }})
        run: |
          if [ -n "${{ matrix.arch.cross_prefix }}" ]; then
            # Build via QEMU + Docker for ARM64 — native emulation avoids cross-compilation pain
            docker run --platform linux/arm64 --rm -v ${{ github.workspace }}:/work -w /work \
              rust:latest bash -c "
                apt-get update -qq && apt-get install -y -qq libpcap-dev > /dev/null
                cargo build --release
              "
            sudo mkdir -p target/${{ matrix.arch.rust_target }}/release
            sudo cp ${{ github.workspace }}/target/release/psnet target/${{ matrix.arch.rust_target }}/release/psnet
          else
            cargo build --release --target ${{ matrix.arch.rust_target }}
          fi

      - name: Create .deb package (${{ matrix.arch.deb_arch }})
        run: |
          VERSION="$VERSION_STRIPPED"
          BINARY="${{ github.workspace }}/target/${{ matrix.arch.rust_target }}/release/psnet"
          PKG_ROOT="${{ runner.temp }}/deb/psnet_${VERSION}_${{ matrix.arch.deb_arch }}"

          mkdir -p "$PKG_ROOT/DEBIAN"
          mkdir -p "$PKG_ROOT/usr/bin"
          mkdir -p "$PKG_ROOT/usr/share/doc/psnet"
          mkdir -p "$PKG_ROOT/usr/share/man/man1"

          install -m 0755 "$BINARY" "$PKG_ROOT/usr/bin/psnet"
          cp LICENSE "$PKG_ROOT/usr/share/doc/psnet/" 2>/dev/null || true
          cp README.md "$PKG_ROOT/usr/share/doc/psnet/"

          {
            printf 'Package: psnet\n'
            printf 'Version: %s\n' "$VERSION"
            printf 'Section: net\n'
            printf 'Priority: optional\n'
            printf 'Architecture: %s\n' "${{ matrix.arch.deb_arch }}"
            printf 'Depends: %s (>= 1.9), libc6 (>= 2.31)\n' "${{ matrix.arch.syslib }}"
            printf 'Maintainer: naqoyqatsi83 <naqoyqatsi83@users.noreply.github.com>\n'
            printf 'Description: Real-time TUI network monitor for Linux\n'
            printf ' 9 interactive tabs covering live speed graphs, active connections,\n'
            printf ' world map, LAN device discovery, firewall management, topology\n'
            printf ' visualization, and packet capture. All in a single binary.\n'
            printf 'Homepage: https://github.com/naqoyqatsi83/psnet\n'
          } > "$PKG_ROOT/DEBIAN/control"

          {
            printf '#!/bin/sh\n'
            printf 'set -e\n'
            printf 'if [ -x /usr/bin/psnet ]; then\n'
            printf '    /usr/sbin/setcap cap_net_raw+ep /usr/bin/psnet 2>/dev/null || true\n'
            printf 'fi\n'
            printf 'exit 0\n'
          } > "$PKG_ROOT/DEBIAN/postinst"
          chmod 755 "$PKG_ROOT/DEBIAN/postinst"

          {
            printf '#!/bin/sh\n'
            printf 'set -e\n'
            printf 'exit 0\n'
          } > "$PKG_ROOT/DEBIAN/postrm"
          chmod 755 "$PKG_ROOT/DEBIAN/postrm"

          dpkg-deb --build "$PKG_ROOT" "${{ runner.temp }}/deb/psnet_${VERSION}_${{ matrix.arch.deb_arch }}.deb"

      - name: Create tarball (${{ matrix.arch.target }})
        run: |
          VERSION="$VERSION_STRIPPED"
          TAR_DIR="${{ runner.temp }}/tar"
          mkdir -p "$TAR_DIR/psnet-${VERSION}"
          install -m 0755 "${{ github.workspace }}/target/${{ matrix.arch.rust_target }}/release/psnet" "$TAR_DIR/psnet-${VERSION}/psnet"
          cp README.md LICENSE "$TAR_DIR/psnet-${VERSION}/" 2>/dev/null || true
          cd "$TAR_DIR" && tar czf "${{ runner.temp }}/psnet-${VERSION}-${{ matrix.arch.pkg_suffix }}-unknown-linux-gnu.tar.gz" "psnet-${VERSION}"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: psnet-${{ matrix.arch.deb_arch }}.deb
          path: ${{ runner.temp }}/deb/psnet_*.deb

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: psnet-${{ matrix.arch.pkg_suffix }}-tar.gz
          path: ${{ runner.temp }}/psnet-*.tar.gz

  # RPM build (x86_64 only — RPM cross-build is complex)
  rpm:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install RPM build tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Determine version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION_STRIPPED=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          else
            V=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[0].version')
            echo "VERSION_STRIPPED=$V" >> $GITHUB_ENV
          fi

      - name: Download amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: psnet-amd64.deb
          path: ${{ runner.temp }}/download

      - name: Create RPM package
        run: |
          VERSION="$VERSION_STRIPPED"
          mkdir -p $HOME/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          # Extract binary from .deb (simpler than rebuilding)
          cd ${{ runner.temp }}/download
          ar x psnet_*.deb
          tar xf data.tar.zst 2>/dev/null || tar xf data.tar.gz 2>/dev/null || true

          # Write spec file (avoid heredocs for YAML parser safety)
          {
            printf 'Name: psnet\n'
            printf 'Version: %s\n' "$VERSION"
            printf 'Release: 1%%{?dist}\n'
            printf 'Summary: Real-time TUI network monitor for Linux\n'
            printf 'License: MIT\n'
            printf 'URL: https://github.com/naqoyqatsi83/psnet\n'
            printf 'Group: Applications/System\n'
            printf 'BuildArch: x86_64\n'
            printf 'Requires: libpcap >= 1.9, glibc >= 2.31\n'
            printf '\n'
            printf '%%description\n'
            printf '9 interactive tabs covering live speed graphs, active connections,\n'
            printf 'world map, LAN device discovery, firewall management, topology\n'
            printf 'visualization, and packet capture. All in a single binary.\n'
            printf '\n'
            printf '%%install\n'
            printf 'mkdir -p %%{buildroot}%%{_bindir}\n'
            printf 'install -m 0755 %%{_sourcedir}/psnet %%{buildroot}%%{_bindir}/psnet\n'
            printf '\n'
            printf '%%files\n'
            printf '%%{_bindir}/psnet\n'
            printf '\n'
            printf '%%post\n'
            printf 'if [ -x %%{_bindir}/psnet ]; then\n'
            printf '    /usr/sbin/setcap cap_net_raw+ep %%{_bindir}/psnet 2>/dev/null || true\n'
            printf 'fi\n'
            printf '\n'
            printf '%%changelog\n'
            printf '* Thu Jun 10 2026 naqoyqatsi83 <naqoyqatsi83@users.noreply.github.com> - %s\n' "$VERSION"
            printf '%s\n' '- Initial Linux port release'
          } > $HOME/rpmbuild/SPECS/psnet.spec

          # Copy binary to SOURCES
          install -m 0755 "${{ runner.temp }}/download/usr/bin/psnet" $HOME/rpmbuild/SOURCES/psnet

          # Build RPM
          rpmbuild -ba $HOME/rpmbuild/SPECS/psnet.spec

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: psnet-x86_64.rpm
          path: $HOME/rpmbuild/RPMS/x86_64/psnet-*.rpm

  release:
    runs-on: ubuntu-latest
    needs: [build, rpm]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Determine version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION_STRIPPED=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          else
            V=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[0].version')
            echo "VERSION_STRIPPED=$V" >> $GITHUB_ENV
          fi

      - name: Collect all artifacts
        run: |
          mkdir -p "${{ runner.temp }}/upload"
          find "${{ runner.temp }}/artifacts" -type f -exec cp {} "${{ runner.temp }}/upload/" \;

      - name: Upload all artifacts (manual run, no release)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: psnet-all-artifacts
          path: ${{ runner.temp }}/upload/

      - name: Create release (tag push only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: psnet v${{ env.VERSION_STRIPPED }}
          body: |
            ## psnet v${{ env.VERSION_STRIPPED }}

            ### Installation
            **Debian/Ubuntu (amd64)**:
            ```bash
            sudo dpkg -i psnet_*_amd64.deb
            ```

            **Debian/Ubuntu (ARM64)**:
            ```bash
            sudo dpkg -i psnet_*_arm64.deb
            ```

            **Fedora/RHEL (amd64)**:
            ```bash
            sudo rpm -i psnet-*.rpm
            ```

            **Arch Linux**:
            ```bash
            cargo install --git https://github.com/naqoyqatsi83/psnet.git
            ```

            **Other distros**: Download the `.tar.gz` for your arch, extract, and run `./psnet`.
            Optionally enable non-root packet capture:
            ```bash
            sudo setcap cap_net_raw+ep ./psnet
            ```

            **Build from source**:
            ```bash
            cargo install --git https://github.com/naqoyqatsi83/psnet.git
            ```
          files: |
            ${{ runner.temp }}/upload/psnet_*.deb
            ${{ runner.temp }}/upload/psnet-*.tar.gz
            ${{ runner.temp }}/upload/psnet-*.rpm
