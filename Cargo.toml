[package]
name = "psnet"
version = "1.2.0"
edition = "2021"
rust-version = "1.80"
description = "A beautiful real-time TUI network monitor — 9 tabs, GeoIP, device discovery, firewall, topology & more"
license = "MIT"
repository = "https://github.com/naqoyqatsi83/psnet"
homepage = "https://github.com/naqoyqatsi83/psnet"
readme = "README.md"
keywords = ["network", "monitor", "tui", "terminal", "cross-platform"]
categories = ["command-line-utilities", "network-programming"]
exclude = [".github/", "target/", "image.png"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
sysinfo = "0.32"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
maxminddb = "0.24"
dns-lookup = "2"
pcap = "0.10"
# Optional: systemd-resolved DNS cache via DBus (feature-gated)
dbus = { version = "0.9", optional = true }

nix = { version = "0.29", features = ["net"] }
libc = "0.2"
procfs = "0.15"
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
